<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscreva-se</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo" id="topo"></header>
<main class="card largo">
<h1>Inscreva-se para começar</h1>
<p class="nota">Projeto escolar: use dados fictícios, nunca informações reais.</p>
<form id="form" class="form-larga" novalidate>
<div class="grade">
<div class="campo">
<label for="nome">Nome</label>
<input id="nome" name="nome" type="text" placeholder="Ex.: Maria" autocomplete="off" required>
</div>
<div class="campo">
<label for="sobrenome">Sobrenome</label>
<input id="sobrenome" name="sobrenome" type="text" placeholder="Ex.: Teste" autocomplete="off" required>
</div>
<div class="campo">
<label for="cpf">CPF</label>
<input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required>
</div>
<div class="campo">
<label for="telefone">Telefone</label>
<input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" maxlength="15" autocomplete="off" required>
</div>
<div class="campo largo">
<label for="email">Email</label>
<input id="email" name="email" type="email" placeholder="teste@exemplo.com" autocomplete="off" required>
</div>
<div class="campo largo">
<label for="senha">Senha</label>
<input id="senha" name="senha" type="password" placeholder="Invente uma senha" autocomplete="off" required>
</div>
<div class="campo largo">
<label for="rua">Rua</label>
<input id="rua" name="rua" type="text" placeholder="Ex.: Rua Exemplo, 123" autocomplete="off" required>
</div>
<div class="campo">
<label for="cep">CEP</label>
<input id="cep" name="cep" type="text" inputmode="numeric" placeholder="00000-000" maxlength="9" autocomplete="off" required>
</div>
<div class="campo">
<label for="cidade">Cidade</label>
<input id="cidade" name="cidade" type="text" placeholder="Ex.: Cidade" autocomplete="off" required>
</div>
<div class="campo">
<label for="estado">Estado</label>
<select id="estado" name="estado" required></select>
</div>
</div>
<p class="erro" id="erro" role="alert"></p>
<button class="btn sec" id="exemplo" type="button">Preencher com dados de exemplo</button>
<button class="btn" id="cadastrar" type="submit">Cadastrar</button>
</form>
<hr class="divisor">
<p class="rodape">Já tem uma conta? <a href="index.html">Entrar</a></p>
</main>
<script src="js/comum.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
