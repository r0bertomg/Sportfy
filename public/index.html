<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo" id="topo"></header>
<main class="card">
<h1>Entrar na sua conta</h1>
<form id="form" novalidate>
<div class="campo">
<label for="cpf">CPF</label>
<input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off" required>
</div>
<div class="campo">
<label for="senha">Senha</label>
<input id="senha" name="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
<button type="button" class="olho" id="olho" aria-label="Mostrar senha">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<p class="erro" id="erro" role="alert"></p>
<button class="btn" id="entrar" type="submit">Entrar</button>
</form>
<hr class="divisor">
<p class="rodape">Não tem uma conta? <a href="cadastro.html">Inscreva-se</a></p>
</main>
<script src="js/comum.js"></script>
<script src="js/login.js"></script>
</body>
</html>
